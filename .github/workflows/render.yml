name: Render MP4 Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    name: Render Video to MP4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render MP4 video
        run: npx remotion render HelloWorld out/video.mp4

      - name: Upload Finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: Rendered-MP4-Video
          path: out/video.mp4
          
